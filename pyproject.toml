[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedkalav"
version = "0.1.0"
description = "Federated KalmanNet for Autonomous Vehicle Navigation"
readme = "README.md"
authors = [{ name = "Krushnakant-08" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "cryptography>=41.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["afkn*"]

[tool.setuptools.package-data]
"afkn.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: builds the full-size (spec) dataset; still run by default and in CI",
]
