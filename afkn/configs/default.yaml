# Default simulation + dataset configuration.
# Every number here is a STARTING DEFAULT to tune. None has been tuned against
# any result, and nothing in this file is taken from a paper.

seed: 0
dt: 0.1                 # [s]
steps: 1000             # steps per trajectory (state has steps+1 samples)
motion_model: ctrv      # ctrv | bicycle
wheelbase: 2.7          # [m]
max_steer_deg: 35.0
max_lateral_accel: 4.0  # [m/s^2]
accel_limit: 2.5        # [m/s^2]
speed_tau: 3.0          # [s]
min_speed: 1.0          # [m/s]
start_pos_std: 50.0     # [m]

process_noise:          # per-step std; Q = diag(std^2)
  pos: 0.02
  heading: 0.002
  speed: 0.01

init_noise:             # initial-estimate error std; P0 = diag(std^2)
  pos: 1.0
  heading: 0.05
  speed: 0.5

seg_len_range: [100, 300]

segments:
  urban:
    speed_range: [5.0, 14.0]
    speed_block_range: [40, 120]
    turn_rate_range: [0.15, 0.6]
    turn_len_range: [15, 50]
    turn_gap_range: [30, 120]
    yaw_wander_std: 0.01
  highway:
    speed_range: [22.0, 34.0]
    speed_block_range: [100, 300]
    turn_rate_range: [0.02, 0.06]
    turn_len_range: [60, 150]
    turn_gap_range: [100, 300]
    yaw_wander_std: 0.004
  tunnel:               # GNSS is forced off for the whole segment
    speed_range: [12.0, 24.0]
    speed_block_range: [100, 300]
    turn_rate_range: [0.0, 0.0]
    yaw_wander_std: 0.003

profiles:
  high_grade:
    gnss: {sigma: 0.5, bias_std: 0.1, p_drop: 0.005}
    imu: {sigma_yaw: 0.002, sigma_acc: 0.02, bias0_std_yaw: 0.001, bias0_std_acc: 0.01,
          rw_yaw: 0.0001, rw_acc: 0.001, scale_std: 0.001}
  mid_grade:
    gnss: {sigma: 1.5, bias_std: 0.3, p_drop: 0.02}
    imu: {sigma_yaw: 0.01, sigma_acc: 0.1, bias0_std_yaw: 0.005, bias0_std_acc: 0.05,
          rw_yaw: 0.0005, rw_acc: 0.005, scale_std: 0.005}
  low_grade:            # honest but noisy
    gnss: {sigma: 4.0, bias_std: 1.0, p_drop: 0.05}
    imu: {sigma_yaw: 0.03, sigma_acc: 0.3, bias0_std_yaw: 0.02, bias0_std_acc: 0.15,
          rw_yaw: 0.002, rw_acc: 0.015, scale_std: 0.02}
  intermittent:         # GNSS-denied windows on top of tunnels
    gnss: {sigma: 1.5, bias_std: 0.3, p_drop: 0.05, outage_windows: [2, 4], outage_len: [40, 150]}
    imu: {sigma_yaw: 0.01, sigma_acc: 0.1, bias0_std_yaw: 0.005, bias0_std_acc: 0.05,
          rw_yaw: 0.0005, rw_acc: 0.005, scale_std: 0.005}
  faulty:               # sensor fault, NOT an attacker; mode is chosen per client
    gnss: {sigma: 1.5, bias_std: 0.3, p_drop: 0.02}
    imu: {sigma_yaw: 0.01, sigma_acc: 0.1, bias0_std_yaw: 0.005, bias0_std_acc: 0.05,
          rw_yaw: 0.0005, rw_acc: 0.005, scale_std: 0.005}
    fault: {mode: constant_bias, gnss_bias_m: 15.0, imu_yaw_bias: 0.05, spike_prob: 0.05, spike_std: 30.0}

# route_mix order: [urban, highway, tunnel]
clients:
  - {profile: high_grade,   route_mix: [0.2, 0.7, 0.1], speed_scale: 1.10, sigma_scale: 1.00}
  - {profile: high_grade,   route_mix: [0.7, 0.2, 0.1], speed_scale: 0.90, sigma_scale: 1.10}
  - {profile: mid_grade,    route_mix: [0.5, 0.4, 0.1], speed_scale: 1.00, sigma_scale: 1.00}
  - {profile: mid_grade,    route_mix: [0.3, 0.5, 0.2], speed_scale: 1.05, sigma_scale: 0.90}
  - {profile: low_grade,    route_mix: [0.6, 0.3, 0.1], speed_scale: 0.95, sigma_scale: 1.00}
  - {profile: low_grade,    route_mix: [0.4, 0.3, 0.3], speed_scale: 1.00, sigma_scale: 1.15}
  - {profile: intermittent, route_mix: [0.4, 0.2, 0.4], speed_scale: 1.00, sigma_scale: 1.00}
  - {profile: intermittent, route_mix: [0.6, 0.1, 0.3], speed_scale: 0.90, sigma_scale: 1.10}
  - {profile: faulty,       route_mix: [0.5, 0.4, 0.1], speed_scale: 1.00, fault_mode: constant_bias}
  - {profile: faulty,       route_mix: [0.3, 0.5, 0.2], speed_scale: 1.00, fault_mode: random_spikes}

splits:
  train: 200
  val: 40
  test: 40
  global_test: 200      # shared by all clients; mixes all profiles
  trusted: 200          # server-only; mixes all profiles; disjoint from every client

mixed_route_mix: [0.5, 0.35, 0.15]
